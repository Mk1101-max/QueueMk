<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext} = React;

/* ---------- Shared store via BroadcastChannel + in-memory ---------- */
// guard: บางเบราว์เซอร์ (Android TV/WebView เก่า) ไม่มี BroadcastChannel
const CH = (typeof BroadcastChannel!=='undefined')
  ? new BroadcastChannel('queue-system')
  : { postMessage(){}, onmessage:null, close(){} };
const Store = createContext(null);

const DEFAULT_STATUSES = [
  'รอออกตั๋ว','รับตั๋ว','รอลูกค้าโอนเงิน','รอเงินเข้าระบบ','รับ E20',
  'นำ Shipment ไปเติมก่อน','รอราคา E20','รอวัดถัง','รอออเดอร์','รอตรวจสอบ',
  'โหลดตั้ง','รอเซ็ตรถ/พขร.','พักทานข้าว','รออนุมัติราคาตั๋ว2','รอราคาตั๋ว2',
  'รออนุมัติเครดิต','รอเคลียร์น้ำมัน','รองาน','นำใบสั่งซื้อไปเติมก่อน','รอบัญชีตัดเงิน',
  'รอสต๊อคน้ำมัน','รอน้ำมัน','รอโอนเงินเพิ่ม','รอเคลียร์เอกสาร',
  'กำลังเรียก','ข้ามคิว'
];
const FIRST_STATUS = DEFAULT_STATUSES[0]; // 'รอออกตั๋ว'

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// คำนวณระยะทางระหว่าง 2 พิกัด (เมตร) ด้วยสูตร Haversine
function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000; const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
// เช็คว่าอยู่ในระยะ geofence ไหม คืน {ok, msg, denied}
async function checkGeofence(geofence){
  if(!geofence || geofence.lat==null) return {ok:true};
  try{
    const pos=await getCurrentPos();
    const dist=distanceMeters(pos.lat,pos.lng,geofence.lat,geofence.lng);
    const radius=geofence.radius||500;
    if(dist>radius) return {ok:false,msg:`คุณอยู่ห่างจากจุดรับคิว ${Math.round(dist)} เมตร (ต้องอยู่ภายใน ${radius} เมตร) — กรุณาเข้ามาใกล้ก่อนกดรับคิว`};
    return {ok:true};
  }catch(e){
    return {ok:false,denied:true,msg:'ต้องอนุญาตให้เข้าถึงตำแหน่ง (GPS) เพื่อกดรับคิว'};
  }
}

// ขอตำแหน่งปัจจุบัน คืน Promise({lat,lng}) หรือ reject
function getCurrentPos(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error('อุปกรณ์นี้ไม่รองรับ GPS')); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>reject(e),
      {enableHighAccuracy:true,timeout:10000,maximumAge:0}
    );
  });
}

// ดึง YouTube video id จาก url หรือ id ตรงๆ
function extractYtId(input){
  if(!input) return null;
  const s=input.trim();
  const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if(m) return m[1];
  if(/^[\w-]{11}$/.test(s)) return s;
  return null;
}

// ดึงวันที่จากชื่อไฟล์ เช่น PTC_21_06_2026 / PTC-21-06-2026 / 21_06_2026 → 'YYYY-MM-DD'
function parseFileDate(name){
  const m=name.match(/(\d{1,2})[_\-.](\d{1,2})[_\-.](\d{2,4})/);
  if(!m) return null;
  let [_,d,mo,y]=m;
  d=+d; mo=+mo; y=+y;
  if(y<100) y+=2000;
  if(d>31||mo>12||d<1||mo<1) return null;
  const pad=n=>String(n).padStart(2,'0');
  return `${y}-${pad(mo)}-${pad(d)}`;
}

/* ===================== DATA LAYER (Supabase หรือ local) ===================== */
const CFG = window.APP_CONFIG || {};
const HAS_SUPABASE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
let sb = null;
if(HAS_SUPABASE && window.supabase){
  try{ sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); }catch(e){ console.error('Supabase init error',e); }
}
// แปลง ticket object <-> แถวในฐานข้อมูล (snake_case)
const ticketToRow = (t)=>({id:t.id,type:t.type,no:t.no,name:t.name,car_no:t.carNo,station:t.station,depot:t.depot,trip:t.trip,company:t.company,phone:t.phone,plate:t.plate,seal:t.seal,note:t.note,product:t.product,volume:t.volume,items:t.items||null,status:t.status,created_at:t.createdAt});
const rowToTicket = (r)=>({id:r.id,type:r.type,no:r.no,name:r.name,carNo:r.car_no,station:r.station,depot:r.depot,trip:r.trip,company:r.company,phone:r.phone,plate:r.plate,seal:r.seal,note:r.note,product:r.product,volume:r.volume,items:r.items,status:r.status,createdAt:r.created_at});
const tripToRow = (t)=>({id:t.id,car_no:t.carNo,station:t.station,depot:t.depot,trip:t.trip,sheet:t.sheet});
const rowToTrip = (r)=>({id:r.id,carNo:r.car_no,station:r.station,depot:r.depot,trip:r.trip,sheet:r.sheet});

function StoreProvider({children}){
  const [tickets,setTickets] = useState([]);
  const [trips,setTrips] = useState([]);
  const [calling,setCalling] = useState(null);
  const [history,setHistory] = useState({});
  const [speakReq,setSpeakReq] = useState(null);
  const [statuses,setStatuses] = useState(DEFAULT_STATUSES);
  const [playlist,setPlaylist] = useState([]);
  const [playMode,setPlayMode] = useState('order');
  const [geofence,setGeofence] = useState(null); // {lat,lng,radius} หรือ null=ปิด

  const broadcast = (type,payload)=>{ if(!HAS_SUPABASE) CH.postMessage({type,payload}); };
  const sbChannelRef = useRef(null);
  const stateRef = useRef({});
  useEffect(()=>{stateRef.current={tickets,trips,calling,history,statuses,playlist,playMode};},[tickets,trips,calling,history,statuses,playlist,playMode]);

  /* ---------- โหมด Supabase: โหลด + realtime ---------- */
  useEffect(()=>{
    if(!HAS_SUPABASE || !sb) return;
    let active=true;
    const loadAll=async()=>{
      const [tk,tp,st,pl,hi,ap] = await Promise.all([
        sb.from('tickets').select('*'),
        sb.from('trips').select('*'),
        sb.from('statuses').select('*').order('ord'),
        sb.from('playlist').select('*').order('ord'),
        sb.from('history').select('*'),
        sb.from('app_state').select('*'),
      ]);
      if(!active) return;
      if(tk.data) setTickets(tk.data.map(rowToTicket));
      if(tp.data) setTrips(tp.data.map(rowToTrip));
      if(st.data){ const extra=st.data.map(r=>r.name).filter(n=>!DEFAULT_STATUSES.includes(n));
        const idx=DEFAULT_STATUSES.indexOf('กำลังเรียก');
        setStatuses([...DEFAULT_STATUSES.slice(0,idx),...extra,...DEFAULT_STATUSES.slice(idx)]); }
      if(pl.data) setPlaylist(pl.data.map(r=>({id:r.id,url:r.url,vid:r.vid})));
      if(hi.data){ const h={}; hi.data.forEach(r=>{ (h[r.station]=h[r.station]||[]).push(r.date); }); Object.keys(h).forEach(k=>h[k].sort()); setHistory(h); }
      if(ap.data){ ap.data.forEach(r=>{ if(r.key==='playMode') setPlayMode(r.value); if(r.key==='calling') setCalling(r.value); if(r.key==='geofence') setGeofence(r.value); }); }
    };
    loadAll();
    const reloadTickets=async()=>{ const {data}=await sb.from('tickets').select('*'); if(active&&data) setTickets(data.map(rowToTicket)); };
    const reloadTrips=async()=>{ const {data}=await sb.from('trips').select('*'); if(active&&data) setTrips(data.map(rowToTrip)); };
    // realtime: ทุกตารางเปลี่ยน → โหลดใหม่ (ง่ายและชัวร์สำหรับขนาดข้อมูลนี้)
    const ch = sb.channel('queue-realtime')
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>reloadTickets())
      .on('postgres_changes',{event:'*',schema:'public',table:'trips'},()=>reloadTrips())
      .on('postgres_changes',{event:'*',schema:'public',table:'statuses'},loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'playlist'},loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'history'},loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'app_state'},(p)=>{
        const r=p.new||{}; if(r.key==='playMode') setPlayMode(r.value); if(r.key==='calling') setCalling(r.value); if(r.key==='geofence') setGeofence(r.value);
      })
      // เสียงเรียกคิว: ส่งสดผ่าน broadcast (ไม่แตะ DB — เร็วและไม่ติดปัญหา row ไม่เปลี่ยน)
      .on('broadcast',{event:'speak'},(msg)=>{ if(msg&&msg.payload) setSpeakReq(msg.payload); })
      .on('broadcast',{event:'calling'},(msg)=>{ if(msg&&msg.payload) setCalling(msg.payload.id); })
      .subscribe();
    sbChannelRef.current = ch;
    return ()=>{ active=false; sbChannelRef.current=null; sb.removeChannel(ch); };
  },[]);

  /* ---------- โหมด local (ไม่มี Supabase): BroadcastChannel เดิม ---------- */
  useEffect(()=>{
    if(HAS_SUPABASE) return;
    CH.onmessage = (e)=>{
      const {type,payload} = e.data;
      if(type==='sync-request'){ broadcast('sync-state',stateRef.current); CH.postMessage({type:'sync-state',payload:stateRef.current}); }
      if(type==='sync-state'){ setTickets(payload.tickets); setTrips(payload.trips); setCalling(payload.calling); if(payload.history)setHistory(payload.history); if(payload.statuses)setStatuses(payload.statuses); if(payload.playlist)setPlaylist(payload.playlist); if(payload.playMode)setPlayMode(payload.playMode); }
      if(type==='add'){ setTickets(t=> t.some(x=>x.id===payload.id)?t:[...t,payload]); }
      if(type==='update'){ setTickets(t=>t.map(x=>x.id===payload.id?{...x,...payload.patch}:x)); }
      if(type==='remove'){ setTickets(t=>t.filter(x=>x.id!==payload.id)); }
      if(type==='trips'){ setTrips(payload); }
      if(type==='trip-update'){ setTrips(t=>t.map(x=>x.id===payload.id?{...x,...payload.patch}:x)); }
      if(type==='history'){ setHistory(payload); }
      if(type==='statuses'){ setStatuses(payload); }
      if(type==='playlist'){ setPlaylist(payload); }
      if(type==='playmode'){ setPlayMode(payload); }
      if(type==='speak'){ setSpeakReq(payload); }
      if(type==='calling'){ setCalling(payload); }
    };
    CH.postMessage({type:'sync-request',payload:{}});
    return ()=>{CH.onmessage=null;};
  },[]);

  /* ---------- Actions (เขียน Supabase ถ้ามี ไม่งั้น local) ---------- */
  const addTicket = (t)=>{
    const seq = tickets.filter(x=>x.type===t.type).length+1;
    const tk={...t,id:genId(),no:seq,createdAt:Date.now(),status:FIRST_STATUS};
    if(HAS_SUPABASE){ sb.from('tickets').insert(ticketToRow(tk)).then(({error})=>{if(error)console.error(error);}); }
    else { setTickets(prev=>[...prev,tk]); broadcast('add',tk); }
    return tk;
  };
  const updateTicket = (id,patch)=>{
    if(HAS_SUPABASE){ const row={}; if('status' in patch)row.status=patch.status; sb.from('tickets').update(row).eq('id',id).then(({error})=>{if(error)console.error(error);}); }
    else { setTickets(t=>t.map(x=>x.id===id?{...x,...patch}:x)); broadcast('update',{id,patch}); }
  };
  const removeTicket = (id)=>{
    if(HAS_SUPABASE){
      sb.from('tickets').delete().eq('id',id).then(({error})=>{if(error)console.error(error);});
      if(calling===id) setCall(null);
    } else {
      setTickets(t=>t.filter(x=>x.id!==id));
      setCalling(c=>{ if(c===id){broadcast('calling',null); return null;} return c; });
      broadcast('remove',{id});
    }
  };
  const setTripsAll = (rows)=>{
    if(HAS_SUPABASE){
      (async()=>{ await sb.from('trips').delete().neq('id',''); if(rows.length) await sb.from('trips').insert(rows.map(tripToRow)); })();
    } else { setTrips(rows); broadcast('trips',rows); }
  };
  const updateTrip = (id,patch)=>{
    if(HAS_SUPABASE){ const row={}; if('carNo' in patch)row.car_no=patch.carNo; sb.from('trips').update(row).eq('id',id).then(({error})=>{if(error)console.error(error);}); }
    else { setTrips(t=>t.map(x=>x.id===id?{...x,...patch}:x)); broadcast('trip-update',{id,patch}); }
  };
  const addHistory = (stations,dateStr)=>{
    if(HAS_SUPABASE){
      const rows=stations.map(st=>({station:st,date:dateStr}));
      sb.from('history').upsert(rows,{onConflict:'station,date'}).then(({error})=>{if(error)console.error(error);});
    } else {
      setHistory(prev=>{
        const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-2);
        const cut=cutoff.toISOString().slice(0,10);
        const next={...prev};
        stations.forEach(st=>{ const arr=new Set(next[st]||[]); arr.add(dateStr); next[st]=[...arr].filter(d=>d>=cut).sort(); });
        broadcast('history',next); return next;
      });
    }
  };
  const setHistoryAll = (h)=>{
    if(HAS_SUPABASE){
      const rows=[]; Object.entries(h).forEach(([st,dates])=>dates.forEach(d=>rows.push({station:st,date:d})));
      sb.from('history').upsert(rows,{onConflict:'station,date'}).then(({error})=>{if(error)console.error(error);});
    } else { setHistory(h); broadcast('history',h); }
  };
  const setCall = (id)=>{
    if(HAS_SUPABASE){
      sb.from('app_state').upsert({key:'calling',value:id}).then(({error})=>{if(error)console.error(error);});
      setCalling(id);
      const ch=sbChannelRef.current; if(ch){ ch.send({type:'broadcast',event:'calling',payload:{id}}); }
    }
    else { setCalling(id); broadcast('calling',id); }
  };
  const requestSpeak = (text)=>{
    const req={id:genId(),text};
    if(HAS_SUPABASE){
      const ch=sbChannelRef.current;
      if(ch){ ch.send({type:'broadcast',event:'speak',payload:req}); }
    } else { setSpeakReq(req); broadcast('speak',req); }
  };
  const addStatus = (name)=>{
    const s=name.trim(); if(!s) return false;
    if(statuses.includes(s)) return false;
    if(HAS_SUPABASE){
      // ord ต้องเป็น int เล็กๆ (ใช้จำนวนสถานะที่เพิ่มเองเป็นลำดับ) ไม่ใช่ Date.now() ที่เกินขนาด int
      const ord = statuses.length + 1;
      sb.from('statuses').insert({name:s,ord:ord}).then(({error})=>{if(error){console.error(error); alert('เพิ่มสถานะไม่สำเร็จ: '+error.message);}});
      return true;
    }
    setStatuses(prev=>{ if(prev.includes(s)) return prev; const idx=prev.indexOf('กำลังเรียก'); const next=idx>=0?[...prev.slice(0,idx),s,...prev.slice(idx)]:[...prev,s]; broadcast('statuses',next); return next; });
    return true;
  };
  const setPlaylistAll = (list)=>{ if(!HAS_SUPABASE){ setPlaylist(list); broadcast('playlist',list); } };
  const addVideo = (url)=>{
    const vid=extractYtId(url);
    if(!vid) return {ok:false,msg:'ลิงก์ YouTube ไม่ถูกต้อง'};
    if(playlist.length>=30) return {ok:false,msg:'ใส่ได้สูงสุด 30 คลิป'};
    if(playlist.some(p=>p.vid===vid)) return {ok:false,msg:'มีคลิปนี้อยู่แล้ว'};
    const item={id:genId(),url,vid};
    if(HAS_SUPABASE){ sb.from('playlist').insert({...item,ord:playlist.length}).then(({error})=>{if(error)console.error(error);}); }
    else { setPlaylist(prev=>{ const next=[...prev,item]; broadcast('playlist',next); return next; }); }
    return {ok:true};
  };
  const removeVideo = (id)=>{
    if(HAS_SUPABASE){ sb.from('playlist').delete().eq('id',id).then(({error})=>{if(error)console.error(error);}); }
    else { setPlaylist(prev=>{ const next=prev.filter(p=>p.id!==id); broadcast('playlist',next); return next; }); }
  };
  const setMode = (m)=>{
    if(HAS_SUPABASE){ sb.from('app_state').upsert({key:'playMode',value:m}).then(({error})=>{if(error)console.error(error);}); setPlayMode(m); }
    else { setPlayMode(m); broadcast('playmode',m); }
  };
  const setGeofenceVal = (g)=>{
    if(HAS_SUPABASE){ sb.from('app_state').upsert({key:'geofence',value:g}).then(({error})=>{if(error)console.error(error);}); setGeofence(g); }
    else { setGeofence(g); broadcast('geofence',g); }
  };

  return <Store.Provider value={{tickets,trips,calling,history,speakReq,statuses,playlist,playMode,geofence,addTicket,updateTicket,removeTicket,setTripsAll,updateTrip,addHistory,setHistoryAll,setCall,requestSpeak,addStatus,addVideo,removeVideo,setMode,setPlaylistAll,setGeofenceVal}}>{children}</Store.Provider>;
}

/* ---------- Thai TTS (Google TTS หลัก + speechSynthesis สำรอง) ---------- */
function getThaiVoices(){
  if(!('speechSynthesis' in window) || !window.speechSynthesis.getVoices) return [];
  try{
    const voices = window.speechSynthesis.getVoices();
    return (voices||[]).filter(v=>{
      const lang=(v.lang||'').toLowerCase().replace('_','-');
      const name=(v.name||'').toLowerCase();
      return lang.startsWith('th') || name.includes('thai') || name.includes('ไทย');
    });
  }catch(e){ return []; }
}
function pickThaiVoice(){
  const th = getThaiVoices();
  if(th.length===0) return null;
  const pref = th.find(v=>/google|premium|natural|enhanced|online/i.test(v.name));
  return pref || th[0];
}

// แบ่งข้อความยาวเป็นชิ้น ≤200 ตัวอักษร (ข้อจำกัด Google TTS)
function ttsChunks(text){
  const words=text.trim().split(/\s+/);
  const chunks=[]; let cur='';
  for(const w of words){
    if((cur+' '+w).trim().length>180){ if(cur)chunks.push(cur.trim()); cur=w; }
    else cur=(cur+' '+w).trim();
  }
  if(cur)chunks.push(cur.trim());
  return chunks.length?chunks:[text];
}

// audio กลางสำหรับ Google TTS
let _ttsAudio = null;
let _ttsToken = 0;

// เล่นด้วย Google Translate TTS — คืน Promise(true/false)
function googleTTS(text,rate){
  return new Promise((resolve)=>{
    try{
      const chunks=ttsChunks(text);
      const myToken=++_ttsToken;
      if(_ttsAudio){ try{_ttsAudio.pause();}catch(e){} }
      let i=0;
      const a=new Audio();
      _ttsAudio=a;
      a.playbackRate = (rate&&rate>=0.7&&rate<=1.2) ? rate : 1;
      let failed=false;
      const playNext=()=>{
        if(myToken!==_ttsToken){ resolve(true); return; }
        if(i>=chunks.length){ resolve(!failed); return; }
        const part=chunks[i++];
        a.src=`https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q=${encodeURIComponent(part)}`;
        a.play().catch(()=>{ failed=true; resolve(false); });
      };
      a.onended=playNext;
      a.onerror=()=>{ failed=true; resolve(false); };
      // ถ้าโหลดไม่เริ่มภายใน 3 วิ ถือว่าล้มเหลว (จะได้ fallback ไป browser)
      setTimeout(()=>{ if(i===0 && a.paused){ failed=true; resolve(false); } }, 3000);
      playNext();
    }catch(e){ resolve(false); }
  });
}

// เล่นด้วย speechSynthesis (สำรอง) — คืน Promise(true/false) รอจนพูดจบ
function browserTTS(text,opts={}){
  return new Promise((resolve)=>{
    if(!('speechSynthesis' in window)){ resolve(false); return; }
    try{
      try{window.speechSynthesis.cancel();}catch(e){}
      const u=new SpeechSynthesisUtterance(text);
      let v=null;
      if(opts.voiceName){ v=(window.speechSynthesis.getVoices()||[]).find(x=>x.name===opts.voiceName); }
      if(!v) v=pickThaiVoice();
      if(v) u.voice=v;
      u.lang='th-TH'; u.rate=opts.rate||0.9; u.pitch=1.0; u.volume=1.0;
      let done=false;
      u.onend=()=>{ if(!done){done=true; resolve(true);} };
      u.onerror=()=>{ if(!done){done=true; resolve(false);} };
      // หน่วงสั้นๆ ให้ cancel เคลียร์ก่อน (กัน Android TV WebView ตัดเสียง)
      setTimeout(()=>{ try{window.speechSynthesis.speak(u);}catch(e){ if(!done){done=true;resolve(false);} } }, 120);
      setTimeout(()=>{ if(!done){done=true; resolve(true);} }, 12000);
    }catch(e){ resolve(false); }
  });
}

// ตรวจว่ารันอยู่ในแอป Android (มี TTS bridge)
function hasNativeTTS(){
  try{ return !!(window.AndroidTTS && window.AndroidTTS.isAvailable && window.AndroidTTS.isAvailable()); }
  catch(e){ return false; }
}
function nativeTTS(text,rate){
  return new Promise((resolve)=>{
    try{
      window.AndroidTTS.speak(text, rate||1.0);
      // เนทีฟพูดเอง ประเมินเวลาคร่าวจากความยาวข้อความ เพื่อคืนเสียงวิดีโอ
      const ms = Math.max(2000, Math.min(12000, text.length*120));
      setTimeout(()=>resolve(true), ms);
    }catch(e){ resolve(false); }
  });
}

// ฟังก์ชันหลัก: แอป Android → เนทีฟ / เว็บ → Google หรือ browser
// opts: {voiceName, rate, engine:'native'|'google'|'browser'|'auto'}
async function speakThai(text,opts={}){
  if(!text||!text.trim()) return;
  // ถ้าอยู่ในแอป Android ใช้เสียงเนทีฟเสมอ (เสียงไทยในเครื่อง — ดีสุดบน Mi Box)
  if(hasNativeTTS()){ await nativeTTS(text,opts.rate); return; }
  const engine=opts.engine||'auto';
  if(engine==='browser'){ await browserTTS(text,opts); return; }
  const ok=await googleTTS(text,opts.rate);
  if(!ok && engine!=='google'){ await browserTTS(text,opts); }
}
function stopSpeak(){
  if(hasNativeTTS()){ try{window.AndroidTTS.stop();}catch(e){} }
  _ttsToken++;
  if(_ttsAudio){ try{_ttsAudio.pause();}catch(e){} }
  if('speechSynthesis' in window){ try{window.speechSynthesis.cancel();}catch(e){} }
}
// แปลงเบอร์รถให้อ่านชัด: แยกตัวเลขทีละหลัก เว้นวรรค เช่น "212" → "2 1 2"
function spellCarNo(carNo){
  // ตัดส่วนหลังขีด (ชื่อคนขับ) ออก เอาเฉพาะเลขรถ
  const main = String(carNo).split('-')[0].trim();
  // ถ้าเป็นตัวเลขล้วน อ่านทีละหลัก
  if(/^\d+$/.test(main)) return main.split('').join(' ');
  return main;
}

function StatsTable({history}){
  const [q,setQ] = useState('');
  const [sort,setSort] = useState('rounds'); // rounds | avg | name
  // คำนวณสถิติต่อสถานี
  const rows = Object.entries(history).map(([station,dates])=>{
    const ds=[...dates].sort();
    const rounds=ds.length;
    // ช่วงห่างระหว่างแต่ละครั้ง (วัน)
    let avgGap=null, lastGap=null;
    if(rounds>=2){
      const gaps=[];
      for(let i=1;i<ds.length;i++){
        const diff=(new Date(ds[i])-new Date(ds[i-1]))/(1000*60*60*24);
        gaps.push(diff);
      }
      avgGap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
      lastGap=gaps[gaps.length-1];
    }
    return {station,rounds,avgGap,lastGap,first:ds[0],last:ds[ds.length-1]};
  });
  const filtered=rows.filter(r=>!q||r.station.toLowerCase().includes(q.toLowerCase()));
  filtered.sort((a,b)=>{
    if(sort==='name') return a.station.localeCompare(b.station,'th');
    if(sort==='avg') return (b.avgGap??-1)-(a.avgGap??-1);
    return b.rounds-a.rounds;

              <td className="px-4 py-2.5 text-center text-[var(--sub)]">{r.lastGap!=null?r.lastGap+' วัน':'—'}</td>
              <td className="px-4 py-2.5 text-[var(--sub)] text-xs">{r.first} → {r.last}</td>
            </tr>
          ))}
        </tbody>
      </table>
      </div>
    </div>
  </div>;
}

            <td className="px-4 py-2 text-[var(--sub)]">{t.depot||'-'}</td>
            <td className="px-4 py-2 text-[var(--sub)]">{t.trip||'-'}</td>

              <input value={t.carNo} onChange={e=>updateTrip(t.id,{carNo:e.target.value})}

                <div className="flex-1 min-w-0">
                  <div className="text-sm mono truncate">{p.vid}</div>
                  <div className="text-xs text-[var(--sub)] truncate">{p.url}</div>
                </div>
                <button onClick={()=>removeVideo(p.id)} className="bg-[var(--red)]/15 text-[var(--red)] border border-[var(--red)]/40 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-[var(--red)]/25 transition shrink-0">ลบ</button>
              </div>
            ))}

    <p className="text-xs text-[var(--sub)]">วิดีโอจะเล่นวนที่หน้าจอทีวีพร้อมเสียง · ตอนเรียกคิวระบบจะหรี่เสียงวิดีโอแล้วพูดเสียงเรียก จากนั้นคืนเสียงวิดีโออัตโนมัติ (ไม่หยุดวิดีโอ)</p>

function GeofencePanel({geofence,setGeofenceVal,onClose}){
  const [lat,setLat] = useState(geofence?.lat!=null?String(geofence.lat):'');
  const [lng,setLng] = useState(geofence?.lng!=null?String(geofence.lng):'');
  const [radius,setRadius] = useState(geofence?.radius!=null?String(geofence.radius):'500');
  const [msg,setMsg] = useState('');

  const useCurrent=async()=>{
    setMsg('กำลังดึงตำแหน่ง...');
    try{ const pos=await getCurrentPos(); setLat(pos.lat.toFixed(6)); setLng(pos.lng.toFixed(6)); setMsg('ดึงตำแหน่งปัจจุบันแล้ว'); }
    catch(e){ setMsg('ดึงตำแหน่งไม่สำเร็จ — อนุญาต GPS ก่อน หรือกรอกเอง'); }
  };
  const save=()=>{
    const la=parseFloat(lat), ln=parseFloat(lng), r=parseInt(radius);
    if(isNaN(la)||isNaN(ln)){ setMsg('กรุณากรอก lat/long ให้ถูกต้อง'); return; }
    if(la<-90||la>90||ln<-180||ln>180){ setMsg('ค่าพิกัดไม่ถูกต้อง (lat -90..90, long -180..180)'); return; }
    setGeofenceVal({lat:la,lng:ln,radius:isNaN(r)||r<=0?500:r});
    setMsg('บันทึกจุดรับคิวแล้ว'); setTimeout(onClose,800);
  };
  const disable=()=>{ setGeofenceVal(null); setMsg('ปิดการเช็คระยะแล้ว'); setTimeout(onClose,800); };

  return <div className="bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-5 mb-4 slideup">
    <div className="flex items-center justify-between mb-3">
      <h3 className="font-bold display-font">📍 ตั้งจุดรับคิว (เช็คระยะ GPS)</h3>
      <button onClick={onClose} className="text-[var(--sub)] hover:text-[var(--txt)] text-sm">ปิด ✕</button>
    </div>
    <p className="text-sm text-[var(--sub)] mb-4">กำหนดพิกัดศูนย์กลางและรัศมี ลูกค้า (ทั้งรถบริษัทและรถลูกค้า) จะกดรับคิวได้เมื่ออยู่ในระยะที่กำหนดเท่านั้น</p>
    <div className="grid sm:grid-cols-3 gap-3 mb-3">
      <div>
        <label className="text-xs text-[var(--sub)] mb-1 block">Latitude (ละติจูด)</label>
        <input className={inputCls} value={lat} onChange={e=>setLat(e.target.value)} placeholder="เช่น 13.756331" />
      </div>
      <div>
        <label className="text-xs text-[var(--sub)] mb-1 block">Longitude (ลองจิจูด)</label>
        <input className={inputCls} value={lng} onChange={e=>setLng(e.target.value)} placeholder="เช่น 100.501765" />
      </div>
      <div>
        <label className="text-xs text-[var(--sub)] mb-1 block">รัศมี (เมตร)</label>
        <input className={inputCls} value={radius} onChange={e=>setRadius(e.target.value)} placeholder="500" />
      </div>
    </div>
    <div className="flex gap-2 flex-wrap items-center">
      <button onClick={useCurrent} className="bg-[var(--blue)]/15 text-[var(--blue)] border border-[var(--blue)]/40 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-[var(--blue)]/25 transition">📱 ดึงตำแหน่งปัจจุบัน</button>
      <button onClick={save} className="bg-[var(--amber)] text-black px-6 py-2 rounded-xl text-sm font-bold hover:bg-[var(--amber2)] transition">บันทึก</button>
      {geofence&&geofence.lat && <button onClick={disable} className="bg-[var(--red)]/15 text-[var(--red)] border border-[var(--red)]/40 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-[var(--red)]/25 transition">ปิดการเช็คระยะ</button>}
      {msg && <span className="text-sm text-[var(--sub)]">{msg}</span>}
    </div>
    <p className="text-xs text-[var(--sub)] mt-3">หาพิกัดได้จาก Google Maps: คลิกขวาจุดที่ต้องการ → คัดลอกเลขคู่แรก (lat, long) มาวาง</p>
  </div>;
}

function AdminView(){
  const {tickets,updateTicket,removeTicket,setTripsAll,trips,updateTrip,history,addHistory,setHistoryAll,setCall,calling,requestSpeak,statuses,addStatus,playlist,playMode,addVideo,removeVideo,setMode,geofence,setGeofenceVal} = useContext(Store);
  const [tab,setTab] = useState('all');
  const [showGeo,setShowGeo] = useState(false);
  const fileRef = useRef();
  const histRef = useRef();

  const exportHistory=()=>{
    const blob=new Blob([JSON.stringify(history,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='ประวัติเที่ยวรถ_'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(url);
  };
  const handleImport=(e)=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        // รวมกับของเดิม (กันวันซ้ำ)
        const merged={...history};
        Object.entries(data).forEach(([st,dates])=>{
          const set=new Set([...(merged[st]||[]),...dates]);
          merged[st]=[...set].sort();
        });
        setHistoryAll(merged);
        alert('นำเข้าประวัติสำเร็จ: '+Object.keys(data).length+' สถานี');
      }catch(err){ alert('ไฟล์ประวัติไม่ถูกต้อง: '+err.message); }
    };
    reader.readAsText(file);
  };

  const handleFile=(e)=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array'});
        const SKIP=['สมุทรสงคราม']; // แท็บที่ไม่เอา (โครงสร้างต่าง)
        const HEADERS=['ชื่อลูกค้า','เบอร์รถ','เบอร์รถรอบ2','เบอร์รถรอบ3'];
        const rows=[];
        wb.SheetNames.forEach((sheetName)=>{
          if(SKIP.includes(sheetName.trim())) return;
          const ws=wb.Sheets[sheetName];
          const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          aoa.forEach((r,idx)=>{
            const station=(r[1]||'').toString().trim();   // คอลัมน์ B = ชื่อลูกค้า → สถานีที่โชว์
            const carC=(r[2]||'').toString().trim();        // คอลัมน์ C = เบอร์รถ
            const carD=(r[3]||'').toString().trim();        // คอลัมน์ D = เบอร์รถ (สำรอง)
            const depot=(r[5]||'').toString().trim();       // คอลัมน์ F = คลังที่รับ
            const trip=(r[4]||'').toString().trim();
            if(!station || HEADERS.includes(station)) return; // ตัดแถวที่สถานีว่าง/หัวตาราง
            const clean=v=>(v && !HEADERS.includes(v)) ? v : '';
            const carNo = clean(carC) || clean(carD);
            rows.push({id:'trip_'+sheetName+'_'+idx, carNo, station, depot, trip, sheet:sheetName});
          });
        });
        setTripsAll(rows);
        const sheetsUsed=[...new Set(rows.map(r=>r.sheet))];
        // ดึงวันที่จากชื่อไฟล์ เช่น PTC_21_06_2026 → 2026-06-21
        const fileDate=parseFileDate(file.name);
        if(fileDate){
          const stations=[...new Set(rows.map(r=>r.station))];
          addHistory(stations,fileDate);
          alert('โหลดสำเร็จ '+rows.length+' แถว จาก '+sheetsUsed.length+' แท็บ\nบันทึกประวัติวันที่ '+fileDate+' ('+stations.length+' สถานี)');
        } else {
          alert('โหลดสำเร็จ '+rows.length+' แถว จาก '+sheetsUsed.length+' แท็บ\n⚠ อ่านวันที่จากชื่อไฟล์ไม่ได้ — ไม่ได้บันทึกประวัติ\n(ตั้งชื่อไฟล์ให้มีวันที่ เช่น PTC_21_06_2026)');
        }
      }catch(err){ alert('อ่านไฟล์ไม่สำเร็จ: '+err.message); }
    };
    reader.readAsArrayBuffer(file);
  };

  const list = (tab==='all' ? tickets : tickets.filter(t=>t.type===tab)).slice().sort((a,b)=>a.createdAt-b.createdAt);

  const callTicket=(t)=>{
    setCall(t.id);
    updateTicket(t.id,{status:'กำลังเรียก'});
    let text=`เชิญคุณ ${t.name}`;
    if(t.type==='in'){
      if(t.carNo) text += ` รถเบอร์ ${spellCarNo(t.carNo)}`;
    } else {
      if(t.company) text += ` บริษัท ${t.company}`;
    }
    text += ' รับตั๋วครับ';
    requestSpeak(text);
  };

  return <div className="max-w-6xl mx-auto mt-6">
    <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
      <h1 className="display-font text-2xl font-bold">หน้าผู้ดูแล (Admin)</h1>
      <div className="flex gap-2 flex-wrap">
        <input ref={fileRef} type="file" accept=".csv,.xls,.xlsx" onChange={handleFile} className="hidden" />
        <input ref={histRef} type="file" accept=".json" onChange={handleImport} className="hidden" />
        <button onClick={()=>fileRef.current.click()} className="bg-[var(--panel2)] border border-[var(--line)] hover:border-[var(--amber)] px-4 py-2 rounded-xl text-sm transition">⬆ อัปโหลดไฟล์เที่ยวรถ</button>
        <button onClick={exportHistory} className="bg-[var(--panel2)] border border-[var(--line)] hover:border-[var(--teal)] px-4 py-2 rounded-xl text-sm transition">💾 Export ประวัติ</button>
        <button onClick={()=>histRef.current.click()} className="bg-[var(--panel2)] border border-[var(--line)] hover:border-[var(--blue)] px-4 py-2 rounded-xl text-sm transition">📂 Import ประวัติ</button>
        <button onClick={()=>{
          const name=prompt('เพิ่มสถานะใหม่ (พิมพ์ชื่อสถานะ):');
          if(name){ const ok=addStatus(name); alert(ok?'เพิ่มสถานะ "'+name.trim()+'" แล้ว':'มีสถานะนี้อยู่แล้ว หรือชื่อว่าง'); }
        }} className="bg-[var(--amber)]/15 text-[var(--amber)] border border-[var(--amber)]/40 hover:bg-[var(--amber)]/25 px-4 py-2 rounded-xl text-sm transition">➕ เพิ่มสถานะ</button>
        <button onClick={()=>setShowGeo(v=>!v)} className={`px-4 py-2 rounded-xl text-sm transition border ${geofence&&geofence.lat?'bg-[var(--teal)]/15 text-[var(--teal)] border-[var(--teal)]/40':'bg-[var(--panel2)] border-[var(--line)] hover:border-[var(--teal)]'}`}>📍 {geofence&&geofence.lat?`จุดรับคิว (${geofence.radius||500}ม.)`:'ตั้งจุดรับคิว'}</button>
      </div>
    </div>

    {showGeo && <GeofencePanel geofence={geofence} setGeofenceVal={setGeofenceVal} onClose={()=>setShowGeo(false)} />}

    <div className="flex gap-2 mb-4 flex-wrap">
      <button onClick={()=>setTab('all')} className={`tabbtn px-5 py-2 rounded-xl font-semibold text-sm ${tab==='all'?'bg-[var(--amber)] text-black':'bg-[var(--panel)] border border-[var(--line)]'}`}>คิวทั้งหมด ({tickets.length})</button>
      <button onClick={()=>setTab('trips')} className={`tabbtn px-5 py-2 rounded-xl font-semibold text-sm ${tab==='trips'?'bg-[var(--amber)] text-black':'bg-[var(--panel)] border border-[var(--line)]'}`}>🚛 ตารางเที่ยวรถ ({trips.length})</button>

      <button onClick={()=>setTab('video')} className={`tabbtn px-5 py-2 rounded-xl font-semibold text-sm ${tab==='video'?'bg-[var(--amber)] text-black':'bg-[var(--panel)] border border-[var(--line)]'}`}>📺 วิดีโอ ({playlist.length})</button>
    </div>

    {tab==='stats' ? <StatsTable history={history} /> :
     tab==='trips' ? <TripsTable trips={trips} updateTrip={updateTrip} /> :
     tab==='video' ? <VideoManager playlist={playlist} playMode={playMode} addVideo={addVideo} removeVideo={removeVideo} setMode={setMode} /> :

    <div className="bg-[var(--panel)] border border-[var(--line)] rounded-2xl overflow-hidden">
      <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead><tr className="bg-[var(--ink)] text-[var(--sub)] text-left">
          <th className="px-4 py-3 font-medium">คิว</th>
          <th className="px-4 py-3 font-medium">ประเภท</th>
          <th className="px-4 py-3 font-medium">ชื่อ</th>
          <th className="px-4 py-3 font-medium">รายละเอียด</th>
          <th className="px-4 py-3 font-medium">สถานะ</th>
          <th className="px-4 py-3 font-medium text-right">จัดการ</th>
        </tr></thead>
        <tbody>

                  {statuses.map(s=><option key={s}>{s}</option>)}

                  <button onClick={()=>{ if(confirm(`รับคิว ${t.type==='in'?'A':'B'}${String(t.no).padStart(3,'0')} (${t.name}) เสร็จแล้ว และลบออกจากระบบ?`)) removeTicket(t.id); }} className="bg-[var(--teal)]/15 text-[var(--teal)] border border-[var(--teal)]/40 font-semibold px-3 py-1.5 rounded-lg text-xs hover:bg-[var(--teal)]/25 transition whitespace-nowrap">✓ รับคิวเสร็จ</button>

    }

  </div>;
}

/* ===================== TV DISPLAY ===================== */
function TVView(){
  const {tickets,calling,speakReq,playlist,playMode} = useContext(Store);
  const [started,setStarted] = useState(false);
  const [engine,setEngine] = useState('browser'); // 'auto' | 'google' | 'browser'
  const [rate,setRate] = useState(0.95);
  const [thaiVoices,setThaiVoices] = useState([]);
  const [voiceName,setVoiceName] = useState('');
  const [showVoicePanel,setShowVoicePanel] = useState(false);
  const [apiFailed,setApiFailed] = useState(false);
  const lastSpoke = useRef(null);
  const playerRef = useRef(null);
  const playerReady = useRef(false);
  const playIdx = useRef(0);
  const restoreTimer = useRef(null);

  const calledTicket = tickets.find(t=>t.id===calling);
  const waiting = tickets.filter(t=>t.status!=='ข้ามคิว').sort((a,b)=>a.createdAt-b.createdAt);

  // โหลดรายชื่อเสียงไทย
  useEffect(()=>{
    if(!('speechSynthesis' in window)) return;
    const load=()=>{ const v=getThaiVoices(); setThaiVoices(v); if(!voiceName){const p=pickThaiVoice(); if(p)setVoiceName(p.name);} };
    load();
    try{ window.speechSynthesis.onvoiceschanged=load; }catch(e){}
    return ()=>{ try{window.speechSynthesis.onvoiceschanged=null;}catch(e){} };
  },[]);

  // โหลด YouTube IFrame API หลังกดเริ่ม
  // เก็บ playlist ปัจจุบันใน ref ให้ event handler อ่านได้เสมอ
  const orderRef = useRef([]);
  useEffect(()=>{
    if(!started) return;
    const order = playMode==='shuffle' ? shuffle(playlist) : playlist;
    const ids = order.map(p=>p.vid);
    const startList = ids.length>0 ? ids : ['jfKfPfyJRdk'];
    orderRef.current = startList;
    playIdx.current = 0;

    const origin = window.location.origin;
    const badOrigin = !origin || origin==='null'; // เปิดจาก file:// หรือ sandbox
    if(badOrigin){ setApiFailed(true); return; } // ใช้ fallback iframe แทน
    setApiFailed(false);

    let failTimer=setTimeout(()=>{ if(!playerReady.current) setApiFailed(true); }, 6000);

    function nextVideo(target){
      playIdx.current=(playIdx.current+1)%orderRef.current.length;
      target.loadVideoById(orderRef.current[playIdx.current]);
    }
    function makePlayer(){
      try{ if(playerRef.current&&playerRef.current.destroy) playerRef.current.destroy(); }catch(e){}
      playerReady.current=false;
      try{
        playerRef.current = new window.YT.Player('tv-player',{
          host:'https://www.youtube-nocookie.com',
          playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1,origin},
          videoId:startList[0],
          events:{
            onReady:(e)=>{
              playerReady.current=true; clearTimeout(failTimer);
              try{e.target.unMute(); e.target.setVolume(100); e.target.playVideo();}catch(err){}
              // ให้แอป Android เรียกหรี่/คืนเสียง YouTube ได้ (แยกจากเสียงพูด TTS)
              window.__duckVideo=(duck)=>{ try{ e.target.setVolume(duck?8:100); }catch(x){} };
            },
            onStateChange:(e)=>{ if(e.data===window.YT.PlayerState.ENDED){ nextVideo(e.target); } },
            onError:(e)=>{ if(orderRef.current.length>1){ setTimeout(()=>nextVideo(e.target), 500); } }
          }
        });
      }catch(err){ setApiFailed(true); }
    }
    if(window.YT && window.YT.Player){ makePlayer(); }
    else {
      if(!document.getElementById('yt-iframe-api')){
        const tag=document.createElement('script'); tag.id='yt-iframe-api'; tag.src='https://www.youtube.com/iframe_api';
        document.body.appendChild(tag);
      }
      window.onYouTubeIframeAPIReady=makePlayer;
    }
    return ()=>{ clearTimeout(failTimer); try{playerRef.current&&playerRef.current.destroy();}catch(e){} playerReady.current=false; };
  },[started,playlist,playMode]);

  // พูดเสียงเรียกคิว + หรี่เสียงวิดีโอ
  useEffect(()=>{
    if(!speakReq || speakReq.id===lastSpoke.current) return;
    lastSpoke.current=speakReq.id;
    if(!started) return;
    duckAndSpeak(speakReq.text);
  },[speakReq,started]);

  const speakingRef = useRef(false);
  const duckTokenRef = useRef(0);
  const duckAndSpeak=async(text)=>{
    const p=playerRef.current;
    const myToken=++duckTokenRef.current;
    stopSpeak();
    clearTimeout(restoreTimer.current);
    // ในแอป Android: แอปหรี่เสียง YouTube เองผ่าน window.__duckVideo ตอน TTS เริ่ม/จบ
    // ในเว็บปกติ: หรี่ที่นี่
    const inApp = hasNativeTTS();
    if(!inApp && p&&playerReady.current){ try{p.setVolume(8);}catch(e){} }
    const restore=()=>{ if(!inApp && myToken===duckTokenRef.current && p&&playerReady.current){ try{p.setVolume(100);}catch(e){} } };
    speakingRef.current=true;
    try{
      await speakThai(text,{voiceName,rate,engine});  // พูดรอบเดียว รอจบจริง
    }catch(e){}
    if(myToken!==duckTokenRef.current) return;
    speakingRef.current=false;
    restoreTimer.current=setTimeout(restore, 500);
  };

  const startShow=()=>{
    setStarted(true);
    // ปลดล็อกเสียงด้วย user gesture: เล่นเสียงสั้นๆ ทั้งสอง engine
    try{ const a=new Audio(); a.src='data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA'; a.play().catch(()=>{}); }catch(e){}
    speakThai('เริ่มระบบเรียกคิว',{engine,rate});
  };
  const previewVoice=()=>{ speakThai('เชิญคุณ สมชาย รถเบอร์ 2 1 2 รับตั๋วครับ',{engine,voiceName,rate}); };

  // หน้าจอเริ่มต้น: ปุ่มใหญ่กดด้วยรีโมท
  if(!started){
    return <div className="fixed inset-0 bg-[var(--ink)] flex flex-col items-center justify-center z-50 px-6">
      <div className="text-6xl mb-6">⛽</div>
      <h1 className="display-font text-3xl md:text-4xl font-bold mb-2 text-center">ระบบคิวรับน้ำมัน</h1>
      <p className="text-[var(--sub)] mb-10 text-center text-lg">กดปุ่มด้านล่างเพื่อเริ่มแสดงผล (กดครั้งเดียว)</p>
      <button onClick={startShow} autoFocus
        className="bg-[var(--amber)] text-black font-bold text-3xl md:text-4xl px-16 py-8 rounded-3xl hover:bg-[var(--amber2)] focus:bg-[var(--amber2)] focus:ring-8 focus:ring-[var(--amber)]/40 focus:outline-none transition ring-4 ring-[var(--amber)]/30">
        ▶ เริ่มแสดงผล
      </button>
      <p className="text-[var(--sub)] text-sm mt-10 text-center max-w-md">ใช้รีโมท: กดปุ่ม OK / Enter เพื่อเริ่ม · หลังกดแล้ว วิดีโอและเสียงเรียกคิวจะทำงานเองตลอด ไม่ต้องกดอีก</p>
    </div>;
  }

  return <div className="max-w-7xl mx-auto mt-4">
    <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
      <h1 className="display-font text-2xl font-bold">จอแสดงคิว</h1>
      <button onClick={()=>setShowVoicePanel(v=>!v)} className="tabbtn px-4 py-2 rounded-xl text-sm font-semibold bg-[var(--panel)] border border-[var(--line)] hover:border-[var(--amber)]">🎙 เลือกเสียง</button>
    </div>

    {showVoicePanel && <div className="bg-[var(--panel)] border border-[var(--line)] rounded-2xl p-5 mb-5 slideup">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-bold display-font">ตั้งค่าเสียงเรียกคิว</h3>
        <button onClick={()=>setShowVoicePanel(false)} className="text-[var(--sub)] hover:text-[var(--txt)] text-sm">ปิด ✕</button>
      </div>
      {(typeof window!=='undefined' && window.AndroidTTS) && <div className="bg-[var(--teal)]/15 text-[var(--teal)] border border-[var(--teal)]/40 rounded-xl p-3 text-sm mb-4">
        ✓ กำลังใช้แอป Android — เสียงเรียกคิวใช้เสียงไทยในเครื่องโดยตรง (ไม่ต้องตั้งค่าด้านล่าง)
      </div>}
      <div className="grid sm:grid-cols-3 gap-3 mb-4">
        <button onClick={()=>setEngine('auto')} className={`p-4 rounded-xl border text-left ${engine==='auto'?'border-[var(--amber)] bg-[var(--amber)]/5':'border-[var(--line)] bg-[var(--ink)]'}`}>
          <div className="font-bold flex items-center gap-2">{engine==='auto'&&<span className="text-[var(--teal)]">✓</span>}⭐ อัตโนมัติ</div>
          <div className="text-xs text-[var(--sub)] mt-1">ลอง Google ก่อน ถ้าไม่ได้ใช้เสียงในเครื่อง — มีเสียงเสมอ (แนะนำ)</div>
        </button>
        <button onClick={()=>setEngine('google')} className={`p-4 rounded-xl border text-left ${engine==='google'?'border-[var(--amber)] bg-[var(--amber)]/5':'border-[var(--line)] bg-[var(--ink)]'}`}>
          <div className="font-bold flex items-center gap-2">{engine==='google'&&<span className="text-[var(--teal)]">✓</span>}🌐 Google</div>
          <div className="text-xs text-[var(--sub)] mt-1">เสียงไทยจาก Google เหมือนกันทุกเครื่อง · ต้องต่อเน็ต</div>
        </button>
        <button onClick={()=>setEngine('browser')} className={`p-4 rounded-xl border text-left ${engine==='browser'?'border-[var(--amber)] bg-[var(--amber)]/5':'border-[var(--line)] bg-[var(--ink)]'}`}>
          <div className="font-bold flex items-center gap-2">{engine==='browser'&&<span className="text-[var(--teal)]">✓</span>}💻 เบราว์เซอร์</div>
          <div className="text-xs text-[var(--sub)] mt-1">เสียงในเครื่อง (เลือกได้) · บางเครื่องไม่มีเสียงไทย</div>
        </button>
      </div>

      {engine==='browser' && (thaiVoices.length===0
        ? <div className="text-sm text-[var(--red)] bg-[var(--ink)] rounded-xl p-4 mb-3">เครื่องนี้ไม่มีเสียงภาษาไทยในเบราว์เซอร์ — แนะนำให้ใช้ Google แทน</div>
        : <div className="space-y-2 mb-3">
            <div className="text-sm text-[var(--sub)]">เสียงไทยในเครื่อง {thaiVoices.length} เสียง</div>
            {thaiVoices.map(v=>(
              <div key={v.name} className={`flex items-center gap-3 p-3 rounded-xl border ${voiceName===v.name?'border-[var(--amber)] bg-[var(--amber)]/5':'border-[var(--line)] bg-[var(--ink)]'}`}>
                <button onClick={()=>setVoiceName(v.name)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0 ${voiceName===v.name?'bg-[var(--teal)]/20 text-[var(--teal)] border border-[var(--teal)]/40':'bg-[var(--panel2)] border border-[var(--line)]'}`}>{voiceName===v.name?'✓':'เลือก'}</button>
                <div className="flex-1 min-w-0"><div className="font-medium truncate">{v.name}</div><div className="text-xs text-[var(--sub)]">{v.lang}{v.localService?' · ในเครื่อง':' · ออนไลน์'}</div></div>
              </div>
            ))}
          </div>)}

      <div className="pt-4 border-t border-[var(--line)] flex items-center gap-3">
        <span className="text-sm text-[var(--sub)] whitespace-nowrap">ความเร็ว: {rate.toFixed(2)}x</span>
        <input type="range" min="0.7" max="1.2" step="0.05" value={rate} onChange={e=>setRate(+e.target.value)} className="flex-1 accent-[var(--amber)]" />
        <button onClick={previewVoice} className="px-4 py-2 rounded-lg text-sm font-semibold bg-[var(--amber)] text-black hover:bg-[var(--amber2)] whitespace-nowrap">▶ ทดสอบเสียง</button>
      </div>
    </div>}

    {/* Layout: วิดีโอ + คิว พร้อมกัน */}
    <div className="grid md:grid-cols-2 gap-5">
      <div>
        {/* แบนเนอร์กำลังเรียกคิว */}
        <div className={`rounded-3xl p-6 mb-5 text-center border ${calledTicket?'bg-[var(--amber)]/10 border-[var(--amber)] ring':'bg-[var(--panel)] border-[var(--line)]'}`}>
          <div className="text-[var(--sub)] text-sm tracking-widest uppercase mb-2">กำลังเรียกคิว</div>
          {calledTicket ? <div className="slideup">
            <div className="display-font text-6xl font-bold text-[var(--amber)] mono blink">{calledTicket.type==='in'?'A':'B'}{String(calledTicket.no).padStart(3,'0')}</div>
            <div className="text-2xl mt-2 font-semibold">{calledTicket.name}</div>
            <div className="text-[var(--sub)]">{calledTicket.type==='in' ? (calledTicket.station?'สถานี '+calledTicket.station:'') : (calledTicket.company||'')}</div>
            <div className="text-[var(--amber2)] mt-2">กรุณามารับตั๋ว</div>
          </div> : <div className="text-2xl text-[var(--sub)] py-2">— รอเรียกคิว —</div>}
        </div>
        <QueueColumn title="คิวที่รออยู่" list={waiting} calling={calling} />
      </div>
      <div>
        <div className="rounded-2xl overflow-hidden border border-[var(--line)] bg-black sticky top-20" style={{aspectRatio:'16/9'}}>
          {apiFailed
            ? <iframe key={(playlist.map(p=>p.vid).join(',')||'def')} width="100%" height="100%"
                src={ytFallbackSrc(playlist,playMode)}
                title="video" frameBorder="0" allow="autoplay; encrypted-media" allowFullScreen></iframe>
            : <div id="tv-player" className="w-full h-full"></div>}
        </div>
        {apiFailed && <p className="text-xs text-[var(--amber)] mt-2 text-center">โหมดสำรอง: วิดีโอเล่นได้ แต่ระบบหรี่เสียงอัตโนมัติตอนเรียกคิวไม่ได้ (เปิดผ่านเว็บเซิร์ฟเวอร์/โฮสต์จริงเพื่อใช้ฟีเจอร์เต็ม)</p>}
        <p className="text-xs text-[var(--sub)] mt-3 text-center">
          {playlist.length>0 ? `เล่น ${playlist.length} คลิป · ${playMode==='shuffle'?'สุ่มเล่น':'เล่นตามลำดับ'} · เพิ่ม/แก้คลิปได้ที่หน้า Admin` : 'ยังไม่มีคลิป — เพิ่มที่หน้า Admin แท็บวิดีโอ'}
        </p>
      </div>
    </div>
  </div>;
}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// สร้าง src สำหรับ iframe สำรอง (เล่นวน playlist)
function ytFallbackSrc(playlist,playMode){
  const order = playMode==='shuffle' ? shuffle(playlist) : playlist;
  const ids = order.map(p=>p.vid);
  const list = ids.length>0 ? ids : ['jfKfPfyJRdk'];
  const first = list[0];
  const rest = list.join(',');
  // loop+playlist ทำให้วนทั้งชุด
  return `https://www.youtube.com/embed/${first}?autoplay=1&rel=0&modestbranding=1&loop=1&playlist=${rest}`;
}

function QueueColumn({title,list,calling}){
  return <div className="bg-[var(--panel)] border border-[var(--line)] rounded-2xl overflow-hidden">
    <div className="px-5 py-3 border-b border-[var(--line)] flex items-center justify-between">
      <span className="font-bold text-[var(--amber)]">{title}</span>
      <span className="text-sm text-[var(--sub)]">{list.length} คิว</span>
    </div>
    <div className="divide-y divide-[var(--line)] max-h-[520px] overflow-y-auto">
      {list.length===0 && <div className="px-5 py-10 text-center text-[var(--sub)]">ไม่มีคิวรอ</div>}
      {list.map(t=>{
        const color = t.type==='in' ? 'var(--blue)' : 'var(--purple)';
        const prefix = t.type==='in' ? 'A' : 'B';
        const detail = t.type==='in' ? (t.station||'') : (t.company||'');
        return (
        <div key={t.id} className={`px-5 py-3 flex items-center justify-between ${calling===t.id?'bg-[var(--amber)]/10':''}`}>
          <div className="flex items-center gap-4">
            <span className="mono font-bold text-xl" style={{color}}>{prefix}{String(t.no).padStart(3,'0')}</span>
            <div>
              <div className="font-medium flex items-center gap-2">
                {t.name}
                <span className="text-[10px] px-1.5 py-0.5 rounded-full" style={{color,backgroundColor:color+'22'}}>{t.type==='in'?'ภายใน':'ภายนอก'}</span>
              </div>
              <div className="text-xs text-[var(--sub)]">{detail}</div>
            </div>
          </div>
          <StatusBadge s={t.status} />
        </div>
        );
      })}
    </div>
  </div>;
}

  return <div className="max-w-sm mx-auto mt-16 slideup">

      <input type="password" inputMode="numeric" maxLength={6} value={pin}
        onChange={e=>{setPin(e.target.value.replace(/\D/g,''));setErr(false);}}
        onKeyDown={e=>e.key==='Enter'&&submit()}
        className={`w-full text-center tracking-[0.5em] mono text-2xl bg-[var(--ink)] border rounded-xl px-4 py-3 outline-none mb-3 ${err?'border-[var(--red)]':'border-[var(--line)] focus:border-[var(--amber)]'}`}
        placeholder="••••••" autoFocus />
      {err && <div className="text-[var(--red)] text-sm mb-3">รหัสไม่ถูกต้อง</div>}
      <button onClick={submit} className="w-full bg-[var(--amber)] text-black font-bold py-3 rounded-xl hover:bg-[var(--amber2)] transition">เข้าสู่ระบบ</button>
    </div>
  </div>;
}

function App(){
  const [view,setView] = useState('customer');
  useEffect(()=>{ // warm up voices
    window.speechSynthesis?.getVoices();
  },[]);
  const nav=[['customer','ลูกค้า','🧑'],['admin','Admin','🛠'],['tv','จอทีวี','📺']];
  return <StoreProvider>
    <div className="min-h-screen pb-16">
      <header className="sticky top-0 z-20 bg-[var(--ink)]/90 backdrop-blur border-b border-[var(--line)]">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="display-font font-bold text-lg flex items-center gap-2">⛽ ระบบคิวรับน้ำมัน
            <span className={`text-[10px] px-2 py-0.5 rounded-full font-normal ${HAS_SUPABASE?'bg-[var(--teal)]/15 text-[var(--teal)]':'bg-[var(--sub)]/15 text-[var(--sub)]'}`}>{HAS_SUPABASE?'☁ ออนไลน์':'เครื่องเดียว'}</span>
          </div>
          <div className="flex gap-1 bg-[var(--panel)] p-1 rounded-xl border border-[var(--line)]">
            {nav.map(([k,l,ic])=>(
              <button key={k} onClick={()=>setView(k)} className={`tabbtn px-4 py-1.5 rounded-lg text-sm font-semibold ${view===k?'bg-[var(--amber)] text-black':'text-[var(--sub)] hover:text-[var(--txt)]'}`}>{ic} {l}</button>
            ))}
          </div>
        </div>
      </header>
      <main className="px-4">
        {view==='customer' && <CustomerView/>}
        {view==='admin' && <AdminGate/>}
        {view==='tv' && <TVView/>}
      </main>
      <footer className="fixed bottom-0 inset-x-0 bg-[var(--ink)]/90 backdrop-blur border-t border-[var(--line)] py-2 text-center text-xs text-[var(--sub)]">
        {HAS_SUPABASE ? 'เชื่อมต่อ Supabase — ข้อมูล sync ข้ามเครื่องและบันทึกถาวร' : 'โหมดเครื่องเดียว — sync เฉพาะแท็บในเครื่องนี้ (ใส่คีย์ Supabase ใน config.js เพื่อ sync ข้ามเครื่อง)'}
      </footer>
    </div>
  </StoreProvider>;
}

class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error('App error:',err,info); }
  render(){
    if(this.state.err){
      return <div style={{minHeight:'100vh',background:'#0c1420',color:'#e6eef8',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',textAlign:'center',fontFamily:'sans-serif'}}>
        <div style={{fontSize:'48px',marginBottom:'12px'}}>⚠️</div>
        <h2 style={{fontSize:'22px',marginBottom:'8px'}}>เกิดข้อผิดพลาดในการแสดงผล</h2>
        <p style={{color:'#7e98b5',marginBottom:'16px',maxWidth:'480px'}}>เบราว์เซอร์นี้อาจไม่รองรับบางฟีเจอร์ ลองเปิดด้วย Chrome เวอร์ชันล่าสุด หรือบนคอมพิวเตอร์</p>
        <pre style={{color:'#ff5d6c',fontSize:'12px',whiteSpace:'pre-wrap',maxWidth:'90%',overflow:'auto'}}>{String(this.state.err&&this.state.err.message||this.state.err)}</pre>
        <button onClick={()=>location.reload()} style={{marginTop:'20px',background:'#f5a623',color:'#000',fontWeight:'bold',padding:'12px 28px',borderRadius:'12px',border:'none',fontSize:'16px'}}>โหลดใหม่</button>
      </div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
